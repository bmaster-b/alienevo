html, body {

body {

  background-position: center;
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.container {
  background-image: linear-gradient(to right, rgba(50, 50, 50, 0.8), rgba(0, 255, 0, 0.6));
  padding: 40px;
  border-radius: 20px;
  border: none; 
  box-shadow:

  color: white;
  width: fit-content;
  position: relative; /* Belangrijk: dit is het anker voor het Discord logo */
}

a {
  color: #ffffff;
  font-weight: bold;
  text-decoration: underline overline;
}

a:hover {
 color: #000000; /* Felgroen bij hover */
  text-shadow: 0 0 10px #ffffff; /* Geeft een lichtgevend effect */
  text-decoration: underline overline; /* Houdt de lijnen vast */
  transition: 0.2s; /* Zorgt voor een zachte overgang */
}

/* De Discord link die rechts naast de box "plakt" */
.hoek-logo {
  position: absolute; 
  left: 100%;          /* Start aan de rechterbuitenkant van de container */
  margin-left: 20px;   /* Een klein beetje ruimte tussen de box en het logo */
  top: 50%;            /* Zet de bovenkant op de helft */
  transform: translateY(-50%); /* Trekt hem precies naar het midden van de zijkant */
}

.hoek-logo img {
  width: 60px;
  transition: 0.3s;
}

.hoek-logo img:hover {
  /* We herhalen de translateY zodat hij niet verspringt */
  transform: scale(1.2) rotate(10deg); 
  filter: drop-shadow(0 0 10px #5865F2); /* Geeft het logo een blauwe gloed */
}

.licentie {
  margin-top: 25px;      
  font-size: 14px;       /* Iets kleiner gemaakt voor een betere look */
  letter-spacing: 1px;   
  color: red;
  background-color: black;
  border-radius: 2px;
  padding: 5px;
  display: inline-block; /* Zorgt dat het zwarte vlak niet de hele breedte pakt */
}

.music-btn {
  position: fixed;
  top: 20px;
  left: 20px;
  background-color: black;
  border: 2px solid lime;
  color: lime;
  padding: 10px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
  box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
  transition: 0.3s;
  z-index: 1000;
}

.music-btn:hover {
  transform: scale(1.1);
  background-color: #111;
  box-shadow: 0 0 20px lime;
}
